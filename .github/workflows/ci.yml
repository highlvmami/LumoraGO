name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Test
        run: dotnet test --configuration Release --no-build --verbosity normal

      - name: Publish app
        run: dotnet publish src/LumoraGo.App --configuration Release --runtime win-x64 --self-contained false --output publish

      - name: Upload app
        uses: actions/upload-artifact@v4
        with:
          name: LumoraGo-win-x64
          path: publish/
