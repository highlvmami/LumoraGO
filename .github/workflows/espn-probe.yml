name: ESPN probe
on:
  push:
    branches: [espn-probe]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet run --project livecheck/LiveCheck.csproj -c Release
