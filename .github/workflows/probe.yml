name: probe
on:
  push:
    branches: [api-probe-2]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          set +e
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/130 Safari/537.36"
          J=/tmp/jar.txt
          curl -sL -m 20 -A "$UA" -c $J -b $J -o /tmp/f.html "https://www.turkiye.gov.tr/saglik-titck-nobetci-eczane-sorgulama"
          sed -n '/id="mainForm"/,/<\/form>/p' /tmp/f.html | head -c 6000; echo
          TOKEN=$(grep -o 'name="token" value="[^"]*"' /tmp/f.html | head -1 | sed 's/.*value="//;s/"//')
          echo "TOKEN=$TOKEN"
          echo "=== post il 34"
          curl -sL -m 20 -A "$UA" -c $J -b $J -o /tmp/r.html -w "%{http_code} %{url_effective}\n" --data-urlencode "plakaKodu=34" --data-urlencode "token=$TOKEN" --data-urlencode "btn=Sorgula" "https://www.turkiye.gov.tr/saglik-titck-nobetci-eczane-sorgulama?submit"
          sed -n '/<main/,/<\/main>/p' /tmp/r.html | sed 's/<[^>]*>/ /g' | tr -s ' \n' | head -c 4000; echo
          grep -o '<table[^>]*>' /tmp/r.html | head; grep -o '<tr[^>]*>.\{0,600\}' /tmp/r.html | head -c 3000; echo
          echo "=== istanbul oda"; curl -sL -m 15 -A "$UA" "https://www.istanbuleczaciodasi.org.tr/nobetci-eczane/" | head -c 3000
