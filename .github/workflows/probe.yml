name: probe
on:
  push:
    branches: [api-probe-2]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          set +e
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/130 Safari/537.36"
          echo "=== aladhan day"; curl -s "https://api.aladhan.com/v1/timingsByCity/14-10-2026?city=Istanbul&country=Turkey&method=13" | head -c 400; echo
          for u in "https://www.turkiye.gov.tr/saglik-titck-nobetci-eczane-sorgulama" "https://eczaneler.gen.tr/nobetci-istanbul" "https://www.nobetcieczaneler.org/istanbul/kadikoy" "https://nobetcieczanebul.com/istanbul/kadikoy" "https://www.istanbuleczaciodasi.org.tr/nobetci-eczane/" "https://www.izmireczaciodasi.org.tr/nobetci-eczaneler" "https://www.hastaneler.net/nobetci-eczaneler/istanbul/kadikoy" "https://www.nobetci-eczane.org/istanbul/kadikoy" "https://openapi.izmir.bel.tr/api/ibb/nobetcieczaneler" "https://www.eczanem.com.tr/nobetci-eczaneler/istanbul/kadikoy"; do
            echo "=== $u"; curl -sL -m 15 -A "$UA" -o /tmp/x.html -w "%{http_code} %{url_effective} %{size_download}\n" "$u"; grep -o -i '<title>[^<]*' /tmp/x.html | head -1; grep -o -i 'eczanesi[^<]\{0,80\}' /tmp/x.html | head -3
          done
          echo "=== turkiye.gov.tr form"; curl -sL -m 15 -A "$UA" "https://www.turkiye.gov.tr/saglik-titck-nobetci-eczane-sorgulama" | grep -o -i '<form[^>]*>\|<select[^>]*>\|<option[^>]*>[^<]*' | head -20
