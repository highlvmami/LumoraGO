name: Screenshots

# README'deki ekran görüntülerini yeniler: uygulamayı temiz bir Windows'ta açıp docs/screenshots'a kaydeder ve dala gönderir.
on:
  workflow_dispatch:
  push:
    branches: [claude/project-thread-y0qsg3]
    paths: [tools/screenshots.ps1, .github/workflows/screenshots.yml]

permissions:
  contents: write

jobs:
  capture:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Ekran çözünürlüğü
        shell: pwsh
        continue-on-error: true
        run: |
          Set-TimeZone -Id "Turkey Standard Time"
          Set-DisplayResolution -Width 1920 -Height 1080 -Force
          Add-Type -AssemblyName System.Windows.Forms
          [System.Windows.Forms.Screen]::PrimaryScreen.Bounds

      - name: Publish
        run: dotnet publish src/LumoraGo.App --configuration Release --runtime win-x64 --self-contained false --output publish

      - name: Ekran görüntüleri
        shell: pwsh
        run: tools/screenshots.ps1 -Exe publish/LumoraGo.exe -Out docs/screenshots

      - name: Günlük
        if: always()
        shell: pwsh
        run: Get-ChildItem "$env:LOCALAPPDATA\LumoraGo\logs" -ErrorAction SilentlyContinue | ForEach-Object { Get-Content $_.FullName -Tail 60 }

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: docs/screenshots/

      - name: Dala gönder
        if: always()
        shell: pwsh
        run: |
          git config user.name "Muhammet Oruçoğlu"
          git config user.email "89027734+highlvmami@users.noreply.github.com"
          git add docs/screenshots
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) { git commit -m "Ekran görüntüleri yenilendi"; git push }
